version: 2
updates:
  # `npm` here leaves bun.lock stale, so every PR failed --frozen-lockfile.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    # TypeScript 7 breaks `svelte-kit sync` and `svelte-check`, so the whole
    # group's PR fails until they support it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      functions:
        patterns: ["*"]

  # The workflows pin major tags, which follow patches and minors themselves, so
  # only a major is news here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
